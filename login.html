<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Par Value</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }

    .auth-card {
      background: var(--pv-surface);
      border: 1px solid var(--pv-border);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }

    .auth-logo { text-align: center; margin-bottom: 32px; }

    .auth-card h1 {
      font-family: var(--font-display);
      font-size: 1.625rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--pv-ink);
    }

    .auth-card p { font-size: 0.9375rem; color: var(--pv-text-secondary); margin-bottom: 28px; }

    .fg { margin-bottom: 16px; }
    .fg label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--pv-text-tertiary); margin-bottom: 6px; }
    .fg input { width: 100%; padding: 11px 14px; border: 1px solid var(--pv-border); border-radius: 8px; font-size: 0.9375rem; font-family: var(--font-sans); background: var(--pv-surface); color: var(--pv-ink); outline: none; transition: border-color 0.15s; }
    .fg input:focus { border-color: var(--pv-green); }

    .auth-submit { width: 100%; padding: 12px; background: var(--pv-green); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; font-family: var(--font-sans); cursor: pointer; margin-top: 8px; }
    .auth-submit:hover { background: var(--pv-green-dark); }

    .auth-divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
    .auth-divider hr { flex: 1; border: none; border-top: 1px solid var(--pv-border); }
    .auth-divider span { font-size: 0.8125rem; color: var(--pv-text-tertiary); }

    .btn-google { width: 100%; padding: 11px; background: var(--pv-surface); color: var(--pv-ink); border: 1px solid var(--pv-border); border-radius: 8px; font-size: 0.9375rem; font-weight: 500; font-family: var(--font-sans); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-google:hover { border-color: var(--pv-ink); }

    .auth-switch { text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--pv-text-secondary); }
    .auth-switch a { color: var(--pv-green-dark); font-weight: 500; }

    .error-msg { background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; font-size: 0.875rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .success-msg { background: #F0FDF4; border: 1px solid #BBF7D0; color: #166534; font-size: 0.875rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }

    .fg-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .fg-label-row label { margin-bottom: 0; }
    .link-sm { font-size: 0.8125rem; color: var(--pv-green-dark); font-weight: 500; text-decoration: none; }
    .link-sm:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" height="32">
        <text x="224" y="54" text-anchor="middle" style="font-family:'Playfair Display',Georgia,serif;font-size:38px;font-weight:500;letter-spacing:8px;fill:#1A1A18">PAR VALUE</text>
        <line x1="120" y1="74" x2="320" y2="74" stroke="#1A7F5A" stroke-width="2"/>
      </svg>
    </div>

    <h1>Welcome back</h1>
    <p>Sign in to your Par Value account</p>

    <div class="error-msg" id="error"></div>
    <div class="success-msg" id="success"></div>

    <form id="login-form">
      <div class="fg">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="fg" id="password-fg">
        <div class="fg-label-row">
          <label>Password</label>
          <a href="#" id="forgot-link" class="link-sm">Forgot password?</a>
        </div>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="auth-submit" id="submit-btn">Sign in</button>
    </form>

    <div class="auth-divider"><hr/><span>or</span><hr/></div>

    <button class="btn-google" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/><path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.548 0 9s.348 2.825.957 4.039l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
      Continue with Google
    </button>

    <div class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase.js'

    const form = document.getElementById('login-form')
    const errorEl = document.getElementById('error')
    const successEl = document.getElementById('success')
    const submitBtn = document.getElementById('submit-btn')
    const passwordFg = document.getElementById('password-fg')
    const forgotLink = document.getElementById('forgot-link')
    const titleEl = document.querySelector('.auth-card h1')
    const subEl = document.querySelector('.auth-card p')
    const divider = document.querySelector('.auth-divider')
    const googleBtn = document.getElementById('google-btn')

    let resetMode = false

    function showError(msg) {
      successEl.style.display = 'none'
      errorEl.textContent = msg
      errorEl.style.display = 'block'
    }

    function showSuccess(msg) {
      errorEl.style.display = 'none'
      successEl.textContent = msg
      successEl.style.display = 'block'
    }

    function hideMessages() {
      errorEl.style.display = 'none'
      successEl.style.display = 'none'
    }

    function setResetMode(on) {
      resetMode = on
      hideMessages()
      passwordFg.style.display = on ? 'none' : 'block'
      document.getElementById('password').required = !on
      divider.style.display = on ? 'none' : 'flex'
      googleBtn.style.display = on ? 'none' : 'flex'
      titleEl.textContent = on ? 'Reset your password' : 'Welcome back'
      subEl.textContent = on ? "Enter your email and we'll send you a reset link" : 'Sign in to your Par Value account'
      submitBtn.textContent = on ? 'Send reset link' : 'Sign in'
      forgotLink.textContent = on ? 'Back to sign in' : 'Forgot password?'
    }

    forgotLink.addEventListener('click', (e) => {
      e.preventDefault()
      setResetMode(!resetMode)
    })

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      hideMessages()

      if (resetMode) {
        submitBtn.textContent = 'Sending...'
        submitBtn.disabled = true

        const { error } = await supabase.auth.resetPasswordForEmail(
          document.getElementById('email').value,
          { redirectTo: window.location.origin + '/reset-password.html' }
        )

        submitBtn.disabled = false
        submitBtn.textContent = 'Send reset link'

        if (error) {
          showError(error.message)
        } else {
          showSuccess('Check your email for a link to reset your password.')
        }
        return
      }

      submitBtn.textContent = 'Signing in...'
      submitBtn.disabled = true

      const { error } = await supabase.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      })

      if (error) {
        showError(error.message)
        submitBtn.textContent = 'Sign in'
        submitBtn.disabled = false
      } else {
        const next = new URLSearchParams(window.location.search).get('next')
        window.location.href = next || 'browse.html'
      }
    })

    document.getElementById('google-btn').addEventListener('click', async () => {
      await supabase.auth.signInWithOAuth({ provider: 'google' })
    })
  </script>

</body>
</html>
