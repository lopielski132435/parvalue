<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages — Par Value</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    html, body { background: var(--pv-paper); height: 100%; }
    body { display: flex; flex-direction: column; }

    /* ── Nav ── */
    .nav {
      background: var(--pv-surface);
      border-bottom: 1px solid var(--pv-border);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      flex-shrink: 0;
    }
    .nav-logo svg { display: block; }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .nav-link {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--pv-text-secondary);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .nav-link:hover { color: var(--pv-ink); text-decoration: none; }
    .nav-link.active { color: var(--pv-ink); }
    .btn-sell {
      padding: 8px 18px;
      background: var(--pv-green);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      text-decoration: none;
    }
    .btn-sell:hover { background: var(--pv-green-dark); text-decoration: none; color: #fff; }
    .nav-user {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--pv-border); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 600; color: var(--pv-text-secondary);
    }

    /* ── Layout ── */
    .messages-layout {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 0;
      border-left: 1px solid var(--pv-border);
      border-right: 1px solid var(--pv-border);
      background: var(--pv-surface);
    }

    /* ── Thread list ── */
    .thread-list-pane {
      border-right: 1px solid var(--pv-border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .thread-list-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--pv-border);
      flex-shrink: 0;
    }

    .thread-list-header h1 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 600;
    }

    .thread-list {
      flex: 1;
      overflow-y: auto;
    }

    .thread-item {
      display: flex;
      gap: 12px;
      padding: 14px 20px;
      cursor: pointer;
      border-bottom: 1px solid var(--pv-border);
      transition: background 0.12s;
      position: relative;
    }

    .thread-item:hover { background: var(--pv-paper); }
    .thread-item.selected { background: #F0FAF5; }

    .thread-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--pv-paper);
      border: 1px solid var(--pv-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.875rem; font-weight: 600; color: var(--pv-text-secondary);
      flex-shrink: 0;
      overflow: hidden;
    }
    .thread-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .thread-avatar.anon { background: #EFEDE6; color: var(--pv-text-tertiary); }

    .thread-info { flex: 1; min-width: 0; }

    .thread-top-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
    }

    .thread-name { font-size: 0.875rem; font-weight: 600; color: var(--pv-ink); }
    .thread-time { font-size: 0.6875rem; color: var(--pv-text-tertiary); flex-shrink: 0; }

    .thread-listing-ref {
      font-size: 0.75rem;
      color: var(--pv-text-tertiary);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thread-preview {
      font-size: 0.8125rem;
      color: var(--pv-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thread-item.unread .thread-preview { color: var(--pv-ink); font-weight: 600; }
    .thread-item.unread .thread-name { font-weight: 700; }

    .unread-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--pv-green);
      flex-shrink: 0;
      align-self: center;
    }

    .thread-list-empty {
      padding: 60px 24px;
      text-align: center;
      color: var(--pv-text-secondary);
      font-size: 0.875rem;
    }

    /* ── Thread view ── */
    .thread-view-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .thread-view-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: var(--pv-text-tertiary);
      padding: 40px;
      text-align: center;
    }

    .thread-view-empty h3 { font-family: var(--font-display); font-size: 1.125rem; color: var(--pv-text-secondary); }
    .thread-view-empty p { font-size: 0.875rem; }

    .thread-listing-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--pv-border);
      flex-shrink: 0;
      text-decoration: none;
      color: inherit;
    }
    .thread-listing-strip:hover { background: var(--pv-paper); text-decoration: none; }

    .strip-photo {
      width: 44px; height: 44px;
      border-radius: 7px;
      background: var(--pv-paper);
      border: 1px solid var(--pv-border);
      overflow: hidden;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--pv-border);
    }
    .strip-photo img { width: 100%; height: 100%; object-fit: cover; }

    .strip-info { flex: 1; min-width: 0; }
    .strip-name { font-size: 0.875rem; font-weight: 600; color: var(--pv-ink); }
    .strip-price { font-size: 0.8125rem; color: var(--pv-text-secondary); }

    .strip-counterparty {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .anon-badge {
      font-size: 0.6875rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 5px;
      background: #EFEDE6;
      color: var(--pv-text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .revealed-badge {
      font-size: 0.6875rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 5px;
      background: #E8F5EE;
      color: var(--pv-green);
    }

    .thread-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-row { display: flex; }
    .msg-row.mine { justify-content: flex-end; }

    .msg-bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.45;
      word-wrap: break-word;
    }

    .msg-row:not(.mine) .msg-bubble {
      background: var(--pv-paper);
      color: var(--pv-ink);
      border-bottom-left-radius: 4px;
    }

    .msg-row.mine .msg-bubble {
      background: var(--pv-green);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-meta {
      font-size: 0.6875rem;
      color: var(--pv-text-tertiary);
      margin-top: 3px;
      padding: 0 4px;
    }
    .msg-row.mine .msg-meta { text-align: right; }

    .anon-notice {
      text-align: center;
      font-size: 0.75rem;
      color: var(--pv-text-tertiary);
      padding: 10px 16px;
      background: var(--pv-paper);
      border-radius: 8px;
      margin: 0 20px 12px;
    }

    .thread-input-bar {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--pv-border);
      flex-shrink: 0;
    }

    .thread-input-bar textarea {
      flex: 1;
      resize: none;
      height: 42px;
      max-height: 120px;
      padding: 10px 14px;
      border: 1px solid var(--pv-border);
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: var(--font-sans);
      outline: none;
      line-height: 1.4;
    }

    .thread-input-bar textarea:focus { border-color: var(--pv-green); }

    .btn-send {
      padding: 0 20px;
      background: var(--pv-green);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-send:hover { background: var(--pv-green-dark); }
    .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

    .login-prompt {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      padding: 60px 24px;
      text-align: center;
    }

    .login-prompt h2 { font-family: var(--font-display); font-size: 1.375rem; }
    .login-prompt p { color: var(--pv-text-secondary); font-size: 0.9375rem; max-width: 320px; }
    .login-prompt a.btn-sell { padding: 11px 24px; }

    @media (max-width: 760px) {
      .messages-layout { grid-template-columns: 1fr; border: none; }
      .thread-list-pane { display: var(--list-display, flex); }
      .thread-view-pane { display: var(--view-display, none); }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a class="nav-logo" href="browse.html">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" height="26">
        <text x="224" y="54" text-anchor="middle" style="font-family:'Playfair Display',Georgia,serif;font-size:38px;font-weight:500;letter-spacing:8px;fill:#1A1A18">PAR VALUE</text>
        <line x1="120" y1="74" x2="320" y2="74" stroke="#1A7F5A" stroke-width="2"/>
      </svg>
    </a>
    <div class="nav-actions">
      <a class="nav-link" href="browse.html">Browse</a>
      <a class="nav-link active" href="messages.html">Messages</a>
      <a class="nav-link" href="#">Watchlist</a>
      <a class="btn-sell" href="sell.html">List a club</a>
      <button class="nav-user" id="nav-user-btn">—</button>
    </div>
  </nav>

  <div class="messages-layout" id="messages-layout">
    <!-- filled by JS -->
  </div>

  <script type="module">
    import { supabase } from './js/supabase.js'
    import { STATE_NAME } from './js/states.js'
    import { initNav } from './js/nav.js'

    const layout = document.getElementById('messages-layout')

    const navResult = await initNav(supabase)
    const session = navResult?.session ?? null

    if (!session) {
      layout.innerHTML = `
        <div class="login-prompt" style="grid-column:1/-1">
          <h2>Sign in to view your messages</h2>
          <p>You'll need an account to message sellers or respond to buyers. Browsing the marketplace doesn't require one.</p>
          <a class="btn-sell" href="login.html?next=messages.html">Sign in</a>
        </div>
      `
    } else {
      const me = session.user.id

      layout.innerHTML = `
        <div class="thread-list-pane">
          <div class="thread-list-header"><h1>Messages</h1></div>
          <div class="thread-list" id="thread-list"></div>
        </div>
        <div class="thread-view-pane" id="thread-view">
          <div class="thread-view-empty">
            <h3>Select a conversation</h3>
            <p>Messages with buyers and sellers will appear here.</p>
          </div>
        </div>
      `

      runMessaging(me)
    }

    async function runMessaging(me) {
      const params = new URLSearchParams(location.search)
      const deepLinkListing = params.get('listing')
      const deepLinkWith = params.get('with')

      let threads = []          // [{ listingId, otherId, role, listing, messages, lastMsg, unreadCount }]
      let activeThread = null
      let realtimeChannel = null

      await loadThreads()

      // Deep link: open/create a thread from "Message seller"
      if (deepLinkListing && deepLinkWith && deepLinkWith !== me) {
        let thread = threads.find(t => t.listingId === deepLinkListing && t.otherId === deepLinkWith)
        if (!thread) {
          const [{ data: listing }, { data: otherProfile }] = await Promise.all([
            supabase.from('listings').select('id, brand, model, price, user_id, listing_images(url, position)').eq('id', deepLinkListing).single(),
            supabase.from('profiles').select('state').eq('id', deepLinkWith).maybeSingle(),
          ])
          if (listing) {
            thread = {
              listingId: deepLinkListing,
              otherId: deepLinkWith,
              otherState: otherProfile?.state || null,
              role: listing.user_id === deepLinkWith ? 'seller' : 'buyer',
              listing,
              messages: [],
              lastMsg: null,
              unreadCount: 0,
              isNew: true,
            }
            threads.unshift(thread)
          }
        }
        if (thread) selectThread(thread)
      }

      renderThreadList()

      // ── Load all messages involving me, group into threads ──
      async function loadThreads() {
        const { data: msgs } = await supabase
          .from('messages')
          .select('id, listing_id, sender_id, recipient_id, body, read, created_at')
          .or(`sender_id.eq.${me},recipient_id.eq.${me}`)
          .order('created_at', { ascending: true })

        if (!msgs || msgs.length === 0) { threads = []; return }

        const groups = {}
        for (const m of msgs) {
          const otherId = m.sender_id === me ? m.recipient_id : m.sender_id
          const key = `${m.listing_id}::${otherId}`
          if (!groups[key]) groups[key] = { listingId: m.listing_id, otherId, messages: [] }
          groups[key].messages.push(m)
        }

        const listingIds = [...new Set(Object.values(groups).map(g => g.listingId))]
        const otherIds = [...new Set(Object.values(groups).map(g => g.otherId))]
        const [{ data: listings }, { data: profiles }] = await Promise.all([
          supabase.from('listings').select('id, brand, model, price, user_id, listing_images(url, position)').in('id', listingIds),
          supabase.from('profiles').select('id, state, is_admin').in('id', otherIds),
        ])
        const listingMap = Object.fromEntries((listings || []).map(l => [l.id, l]))
        const stateMap = Object.fromEntries((profiles || []).map(p => [p.id, p.state]))
        const adminMap = Object.fromEntries((profiles || []).map(p => [p.id, p.is_admin]))

        threads = Object.values(groups).map(g => {
          const listing = listingMap[g.listingId]
          const lastMsg = g.messages[g.messages.length - 1]
          const unreadCount = g.messages.filter(m => m.recipient_id === me && !m.read).length
          return {
            listingId: g.listingId,
            otherId: g.otherId,
            otherState: stateMap[g.otherId] || null,
            otherIsAdmin: adminMap[g.otherId] || false,
            role: listing && listing.user_id === g.otherId ? 'seller' : 'buyer',
            listing,
            messages: g.messages,
            lastMsg,
            unreadCount,
          }
        }).filter(t => t.listing)
          .sort((a, b) => new Date(b.lastMsg.created_at) - new Date(a.lastMsg.created_at))
      }

      // ── Determine if identity should be revealed (offer accepted) ──
      async function getRevealStatus(thread) {
        const buyerId = thread.role === 'seller' ? me : thread.otherId
        const { data: offer } = await supabase
          .from('offers')
          .select('id')
          .eq('listing_id', thread.listingId)
          .eq('buyer_id', buyerId)
          .eq('status', 'accepted')
          .maybeSingle()

        if (!offer) return { revealed: false, profile: null }

        const { data: profile } = await supabase
          .from('profiles')
          .select('full_name, avatar_url')
          .eq('id', thread.otherId)
          .maybeSingle()

        return { revealed: true, profile }
      }

      // ── Render thread list ──
      function renderThreadList() {
        const list = document.getElementById('thread-list')
        if (!list) return
        if (threads.length === 0) {
          list.innerHTML = `<div class="thread-list-empty">No conversations yet. Messages with buyers and sellers will show up here.</div>`
          return
        }
        list.innerHTML = threads.map(t => threadItemHTML(t)).join('')
        threads.forEach(t => {
          const el = document.getElementById(`thread-${t.listingId}-${t.otherId}`)
          if (el) el.addEventListener('click', () => selectThread(t))
        })
        updateSelectedClass()
      }

      const PV_LOGO_AVATAR = `<div class="thread-avatar" style="background:#1A1A18;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" height="12"><text x="224" y="60" text-anchor="middle" style="font-family:'Playfair Display',Georgia,serif;font-size:52px;font-weight:500;letter-spacing:6px;fill:#fff">PV</text></svg></div>`

      function threadItemHTML(t) {
        const label = t.otherIsAdmin ? 'Par Value' : (t.role === 'seller' ? 'Seller' : 'Buyer')
        const stateName = !t.otherIsAdmin && t.otherState ? STATE_NAME[t.otherState] || t.otherState : null
        const preview = t.lastMsg ? t.lastMsg.body : 'Say hello…'
        const isUnread = t.unreadCount > 0
        const avatar = t.otherIsAdmin
          ? PV_LOGO_AVATAR
          : `<div class="thread-avatar anon">${label[0]}</div>`
        return `
          <div class="thread-item${isUnread ? ' unread' : ''}" id="thread-${t.listingId}-${t.otherId}">
            ${avatar}
            <div class="thread-info">
              <div class="thread-top-row">
                <span class="thread-name">${label}${stateName ? ` · ${stateName}` : ''}</span>
                <span class="thread-time">${t.lastMsg ? timeAgo(t.lastMsg.created_at) : ''}</span>
              </div>
              <div class="thread-listing-ref">${t.listing.brand} ${t.listing.model}</div>
              <div class="thread-preview">${escapeHTML(preview)}</div>
            </div>
            ${isUnread ? '<span class="unread-dot"></span>' : ''}
          </div>
        `
      }

      function updateSelectedClass() {
        document.querySelectorAll('.thread-item').forEach(el => el.classList.remove('selected'))
        if (activeThread) {
          const el = document.getElementById(`thread-${activeThread.listingId}-${activeThread.otherId}`)
          if (el) el.classList.add('selected')
        }
      }

      // ── Select + render a thread ──
      async function selectThread(thread) {
        activeThread = thread
        updateSelectedClass()

        // Mark unread as read
        const unreadIds = thread.messages.filter(m => m.recipient_id === me && !m.read).map(m => m.id)
        if (unreadIds.length) {
          await supabase.from('messages').update({ read: true }).in('id', unreadIds)
          thread.messages.forEach(m => { if (unreadIds.includes(m.id)) m.read = true })
          thread.unreadCount = 0
          renderThreadList()
        }

        const { revealed, profile } = await getRevealStatus(thread)
        renderThreadView(thread, revealed, profile)
        subscribeRealtime(thread)
      }

      function renderThreadView(thread, revealed, profile) {
        const view = document.getElementById('thread-view')
        const label = thread.otherIsAdmin ? 'Par Value' : (thread.role === 'seller' ? 'Seller' : 'Buyer')
        const stateName = !thread.otherIsAdmin && thread.otherState ? STATE_NAME[thread.otherState] || thread.otherState : null
        const img = thread.listing.listing_images?.sort((a,b)=>a.position-b.position)?.[0]?.url
        const badgeText = thread.otherIsAdmin
          ? 'Par Value'
          : revealed
            ? `${profile?.full_name || label}${stateName ? ` · ${stateName}` : ''}`
            : `Anonymous ${label}${stateName ? ` · ${stateName}` : ''}`

        view.innerHTML = `
          <a class="thread-listing-strip" href="listing.html?id=${thread.listingId}">
            <div class="strip-photo">${img ? `<img src="${img}" />` : clubIcon()}</div>
            <div class="strip-info">
              <div class="strip-name">${thread.listing.brand} ${thread.listing.model}</div>
              <div class="strip-price">$${Number(thread.listing.price).toLocaleString('en-US')}</div>
            </div>
            <div class="strip-counterparty">
              <span class="${revealed ? 'revealed-badge' : 'anon-badge'}">${escapeHTML(badgeText)}</span>
            </div>
          </a>
          ${!revealed ? `<div class="anon-notice">Identities stay private until an offer is accepted on this listing.</div>` : ''}
          <div class="thread-messages" id="thread-messages"></div>
          <div class="thread-input-bar">
            <textarea id="msg-input" placeholder="Write a message…" maxlength="2000"></textarea>
            <button class="btn-send" id="msg-send-btn">Send</button>
          </div>
        `

        renderMessages(thread)

        const textarea = document.getElementById('msg-input')
        const sendBtn = document.getElementById('msg-send-btn')

        sendBtn.addEventListener('click', () => sendMessage(thread))
        textarea.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault()
            sendMessage(thread)
          }
        })
        textarea.addEventListener('input', () => {
          textarea.style.height = 'auto'
          textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px'
        })
      }

      function renderMessages(thread) {
        const container = document.getElementById('thread-messages')
        if (!container) return
        if (thread.messages.length === 0) {
          container.innerHTML = `<div class="thread-view-empty" style="flex:none;padding:30px"><p>No messages yet — say hello to get started.</p></div>`
          return
        }
        container.innerHTML = thread.messages.map(m => `
          <div class="msg-row${m.sender_id === me ? ' mine' : ''}">
            <div>
              <div class="msg-bubble">${escapeHTML(m.body)}</div>
              <div class="msg-meta">${timeAgo(m.created_at)}</div>
            </div>
          </div>
        `).join('')
        container.scrollTop = container.scrollHeight
      }

      async function sendMessage(thread) {
        const textarea = document.getElementById('msg-input')
        const body = textarea.value.trim()
        if (!body) return

        const sendBtn = document.getElementById('msg-send-btn')
        sendBtn.disabled = true

        const { data: inserted, error } = await supabase
          .from('messages')
          .insert({
            listing_id: thread.listingId,
            sender_id: me,
            recipient_id: thread.otherId,
            body,
          })
          .select()
          .single()

        sendBtn.disabled = false

        if (error) {
          alert(error.message)
          return
        }

        textarea.value = ''
        textarea.style.height = '42px'
        thread.messages.push(inserted)
        thread.lastMsg = inserted
        thread.isNew = false
        renderMessages(thread)
        renderThreadList()
        updateSelectedClass()
      }

      // ── Realtime: new messages on the open thread ──
      function subscribeRealtime(thread) {
        if (realtimeChannel) supabase.removeChannel(realtimeChannel)
        realtimeChannel = supabase
          .channel(`thread-${thread.listingId}-${thread.otherId}`)
          .on('postgres_changes', {
            event: 'INSERT', schema: 'public', table: 'messages',
            filter: `listing_id=eq.${thread.listingId}`,
          }, (payload) => {
            const m = payload.new
            const involvesThread = (m.sender_id === thread.otherId && m.recipient_id === me) ||
                                    (m.sender_id === me && m.recipient_id === thread.otherId)
            if (!involvesThread) return
            if (thread.messages.some(existing => existing.id === m.id)) return
            thread.messages.push(m)
            thread.lastMsg = m
            if (activeThread === thread) {
              if (m.recipient_id === me) {
                supabase.from('messages').update({ read: true }).eq('id', m.id)
                m.read = true
              }
              renderMessages(thread)
            }
            renderThreadList()
          })
          .subscribe()
      }
    }

    function clubIcon() {
      return `<svg width="20" height="20" viewBox="0 0 44 44" fill="none"><path d="M8 22 L30 16 L32 30 L10 34 Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><line x1="30" y1="16" x2="36" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`
    }

    function escapeHTML(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    function timeAgo(iso) {
      const s = (Date.now() - new Date(iso)) / 1000
      if (s < 60) return 'now'
      if (s < 3600) return `${Math.floor(s/60)}m`
      if (s < 86400) return `${Math.floor(s/3600)}h`
      if (s < 604800) return `${Math.floor(s/86400)}d`
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    }
  </script>
