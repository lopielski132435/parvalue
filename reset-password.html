<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Par Value</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }

    .auth-card {
      background: var(--pv-surface);
      border: 1px solid var(--pv-border);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }

    .auth-logo { text-align: center; margin-bottom: 32px; }

    .auth-card h1 {
      font-family: var(--font-display);
      font-size: 1.625rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--pv-ink);
    }

    .auth-card p { font-size: 0.9375rem; color: var(--pv-text-secondary); margin-bottom: 28px; }

    .fg { margin-bottom: 16px; }
    .fg label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--pv-text-tertiary); margin-bottom: 6px; }
    .fg input { width: 100%; padding: 11px 14px; border: 1px solid var(--pv-border); border-radius: 8px; font-size: 0.9375rem; font-family: var(--font-sans); background: var(--pv-surface); color: var(--pv-ink); outline: none; transition: border-color 0.15s; }
    .fg input:focus { border-color: var(--pv-green); }

    .auth-submit { width: 100%; padding: 12px; background: var(--pv-green); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; font-family: var(--font-sans); cursor: pointer; margin-top: 8px; }
    .auth-submit:hover { background: var(--pv-green-dark); }
    .auth-submit:disabled { opacity: 0.6; cursor: default; }

    .auth-switch { text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--pv-text-secondary); }
    .auth-switch a { color: var(--pv-green-dark); font-weight: 500; }

    .error-msg { background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; font-size: 0.875rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .success-msg { background: #F0FDF4; border: 1px solid #BBF7D0; color: #166534; font-size: 0.875rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" height="32">
        <text x="224" y="54" text-anchor="middle" style="font-family:'Playfair Display',Georgia,serif;font-size:38px;font-weight:500;letter-spacing:8px;fill:#1A1A18">PAR VALUE</text>
        <line x1="120" y1="74" x2="320" y2="74" stroke="#1A7F5A" stroke-width="2"/>
      </svg>
    </div>

    <h1>Set a new password</h1>
    <p>Choose a new password for your Par Value account.</p>

    <div class="error-msg" id="error"></div>
    <div class="success-msg" id="success"></div>

    <form id="reset-form">
      <div class="fg">
        <label>New password</label>
        <input type="password" id="password" placeholder="••••••••" minlength="6" required />
      </div>
      <div class="fg">
        <label>Confirm password</label>
        <input type="password" id="confirm" placeholder="••••••••" minlength="6" required />
      </div>
      <button type="submit" class="auth-submit" id="submit-btn">Update password</button>
    </form>

    <div class="auth-switch">Remembered it? <a href="login.html">Sign in</a></div>
  </div>

  <script type="module">
    import { supabase } from './js/supabase.js'

    const form = document.getElementById('reset-form')
    const errorEl = document.getElementById('error')
    const successEl = document.getElementById('success')
    const submitBtn = document.getElementById('submit-btn')

    function showError(msg) {
      successEl.style.display = 'none'
      errorEl.textContent = msg
      errorEl.style.display = 'block'
    }

    function showSuccess(msg) {
      errorEl.style.display = 'none'
      successEl.textContent = msg
      successEl.style.display = 'block'
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault()

      const password = document.getElementById('password').value
      const confirm = document.getElementById('confirm').value

      if (password !== confirm) {
        showError('Passwords do not match.')
        return
      }

      submitBtn.textContent = 'Updating...'
      submitBtn.disabled = true

      const { error } = await supabase.auth.updateUser({ password })

      if (error) {
        showError(error.message || 'This reset link is invalid or has expired. Request a new one from the sign-in page.')
        submitBtn.textContent = 'Update password'
        submitBtn.disabled = false
      } else {
        showSuccess('Password updated. Redirecting to sign in...')
        form.style.display = 'none'
        setTimeout(() => { window.location.href = 'login.html' }, 1800)
      }
    })
  </script>

</body>
</html>
